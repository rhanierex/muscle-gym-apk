<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Muscle Gym</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #0f172a;
        color: white;
        font-family: Arial, sans-serif;
      }
      .wrap {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        flex-direction: column;
        gap: 12px;
      }
      .spinner {
        width: 42px;
        height: 42px;
        border: 4px solid rgba(255,255,255,.15);
        border-top-color: #38bdf8;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .text { opacity: .9; font-size: 16px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="spinner"></div>
      <div class="text">Membuka Muscle Gym...</div>
    </div>
    <script>
      window.location.replace('https://musclegym.my.id/login');
    </script>
  </body>
</html>
